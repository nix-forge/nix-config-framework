site_name: nix-config-framework
site_description: Convention-based NixOS, Home Manager, and nix-darwin configuration assembly.
site_url: https://nix-forge.github.io/nix-config-framework/
repo_url: https://github.com/nix-forge/nix-config-framework
repo_name: nix-forge/nix-config-framework
edit_uri: edit/main/docs/
docs_dir: ../docs
site_dir: ../dist
strict: true
hooks:
  - rewrite_source_links.py
theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true
  locale: en
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: info
    anchors: warn
    unrecognized_links: info
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Compatibility and upgrades: compatibility.md
