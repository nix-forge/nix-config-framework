site_name: nix-config-framework
site_description: Convention-based NixOS, Home Manager, and nix-darwin configuration assembly.
site_url: https://nix-forge.github.io/nix-config-framework/
repo_url: https://github.com/nix-forge/nix-config-framework
repo_name: nix-forge/nix-config-framework
edit_uri: edit/main/docs/
docs_dir: ../docs
site_dir: ../dist
strict: true
hooks:
  - rewrite_source_links.py
theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true
  locale: en
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: info
    anchors: warn
    unrecognized_links: info
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Compatibility and upgrades: compatibility.md
  - Project:
      - OpenSSF baseline: openssf-baseline.md
      - SLSA provenance: slsa.md
      - Release process: releases.md
      - Release notes: releases/README.md
      - Historical releases:
          - v0.1.0: releases/v0.1.0.md
          - v0.1.1: releases/v0.1.1.md
          - v0.1.2: releases/v0.1.2.md
          - v0.1.3: releases/v0.1.3.md
          - v0.1.4: releases/v0.1.4.md
          - v0.1.5: releases/v0.1.5.md
          - v0.1.6: releases/v0.1.6.md
          - v0.1.7: releases/v0.1.7.md
          - v0.1.8: releases/v0.1.8.md
          - v0.1.9: releases/v0.1.9.md
          - v0.1.10: releases/v0.1.10.md
          - v0.1.11: releases/v0.1.11.md
          - v0.1.12: releases/v0.1.12.md
      - Dependency management: dependency-management.md
      - Secret management: secret-management.md
