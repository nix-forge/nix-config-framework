name: Backfill historical source releases
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: historical-source-releases
  cancel-in-progress: false
jobs:
  build:
    name: Attest ${{ matrix.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tag:
          - v0.1.0
          - v0.1.1
          - v0.1.2
          - v0.1.3
          - v0.1.4
          - v0.1.5
          - v0.1.6
          - v0.1.7
          - v0.1.8
          - v0.1.9
          - v0.1.10
          - v0.1.11
          - v0.1.12
    permissions:
      contents: read # Read signed tags and source commits.
      id-token: write # Request a short-lived Sigstore identity.
      attestations: write # Store provenance for the release assets.
    env:
      TAG: ${{ matrix.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the protected release instructions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the signed historical tag and release notes
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$TAG" =~ ^v0\.1\.([0-9]|1[0-2])$ ]]
          test -s "docs/releases/$TAG.md"
          grep -q '^## Changelog$' "docs/releases/$TAG.md"
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          tag_object="$(git rev-parse "$TAG")"
          [[ "$(git cat-file -t "$tag_object")" == tag ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.verification.verified')" == true ]]
          tag_commit="$(git rev-parse "$TAG^{commit}")"
          git merge-base --is-ancestor "$tag_commit" "$GITHUB_SHA"
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" --jq '.object.sha')" == "$tag_object" ]]
      - name: Create source archive and hash manifest
        run: |
          set -euo pipefail
          mkdir release
          archive="nix-config-framework-$TAG.tar.gz"
          git archive --format=tar.gz --prefix="nix-config-framework-$TAG/" --output="release/$archive" "$TAG^{commit}"
          (cd release && sha256sum "$archive" > "$archive.sha256")
          cp "docs/releases/$TAG.md" release/release-notes.md
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'source_ref=refs/tags/%s\n' "$TAG"
            printf 'source_commit=%s\n' "$(git rev-parse "$TAG^{commit}")"
            printf 'signed_tag_object=%s\n' "$(git rev-parse "$TAG")"
            printf 'backfill_workflow_commit=%s\n' "$GITHUB_SHA"
            printf 'archive=%s\n' "$archive"
            printf 'archive_sha256=%s\n' "$(sha256sum "release/$archive" | cut -d ' ' -f 1)"
            printf 'checksum_sha256=%s\n' "$(sha256sum "release/$archive.sha256" | cut -d ' ' -f 1)"
            printf 'release_notes_sha256=%s\n' "$(sha256sum release/release-notes.md | cut -d ' ' -f 1)"
          } > release/release-manifest.txt
      - name: Attest all release content
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/nix-config-framework-${{ matrix.tag }}.tar.gz
            release/nix-config-framework-${{ matrix.tag }}.tar.gz.sha256
            release/release-notes.md
            release/release-manifest.txt
      - name: Export portable provenance
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$PROVENANCE_BUNDLE" "release/nix-config-framework-$TAG.intoto.jsonl"
      - name: Upload verified release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: historical-source-${{ matrix.tag }}
          path: release/
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish historical releases
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      actions: read # Download the immutable build artifacts.
      contents: write # Publish verified GitHub Releases.
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release notes and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download attested assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: historical-source-*
          path: historical-releases
      - name: Verify and publish each tag
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          for tag in v0.1.{0..12}; do
            directory="historical-releases/historical-source-$tag"
            archive="nix-config-framework-$tag.tar.gz"
            manifest="$directory/release-manifest.txt"
            bundle="$directory/nix-config-framework-$tag.intoto.jsonl"
            test -s "$manifest"
            test -s "$bundle"
            tag_commit="$(git rev-parse "$tag^{commit}")"
            tag_object="$(git rev-parse "$tag")"
            grep -Fx "repository=$GITHUB_REPOSITORY" "$manifest"
            grep -Fx "source_ref=refs/tags/$tag" "$manifest"
            grep -Fx "source_commit=$tag_commit" "$manifest"
            grep -Fx "signed_tag_object=$tag_object" "$manifest"
            grep -Fx "backfill_workflow_commit=$GITHUB_SHA" "$manifest"
            grep -Fx "archive=$archive" "$manifest"
            grep -Fx "archive_sha256=$(sha256sum "$directory/$archive" | cut -d ' ' -f 1)" "$manifest"
            grep -Fx "checksum_sha256=$(sha256sum "$directory/$archive.sha256" | cut -d ' ' -f 1)" "$manifest"
            grep -Fx "release_notes_sha256=$(sha256sum "docs/releases/$tag.md" | cut -d ' ' -f 1)" "$manifest"
            cmp "docs/releases/$tag.md" "$directory/release-notes.md"
            (cd "$directory" && sha256sum -c "$archive.sha256")
            for subject in "$archive" "$archive.sha256" release-notes.md release-manifest.txt; do
              gh attestation verify "$directory/$subject" --repo "$GITHUB_REPOSITORY" \
                --bundle "$bundle" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/backfill-source-releases.yml" \
                --signer-digest "$GITHUB_SHA" \
                --source-ref refs/heads/main \
                --deny-self-hosted-runners
            done
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists; refusing to replace its assets" >&2
              continue
            fi
            gh release create "$tag" \
              "$directory/$archive" "$directory/$archive.sha256" \
              "$directory/release-notes.md" "$manifest" "$bundle" \
              --verify-tag --draft --notes-file "docs/releases/$tag.md" \
              --title "nix-config-framework $tag"
            gh release edit "$tag" --draft=false
          done
