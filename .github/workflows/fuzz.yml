name: Fuzz module selectors
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
jobs:
  selectors:
    name: Fuzz module selectors
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0-compatible
        with:
          cache: 'false'
      - uses: nix-forge/ci/actions/fuzz-atheris@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0-compatible fuzz action
        with:
          target: fuzz/selector_fuzzer.py
          input-timeout: '60'
