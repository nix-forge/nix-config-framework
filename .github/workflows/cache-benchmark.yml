name: Nix cache benchmark
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: nix-cache-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    name: Cache ${{ matrix.cache }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cache: ['false', 'true']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@7903659c4b16378411a3ea79dd73cec5c82708cc # v2.0.0
        with:
          cache: ${{ matrix.cache }}
          cache-scope: ci-flake
      - name: Run the native discovery workload
        run: |
          nix store add-path flake/dev
          nix flake check --keep-going --show-trace --print-build-logs --no-build --system x86_64-linux
          nix build --keep-going --show-trace --print-build-logs --no-link .#checks.x86_64-linux.discovery
