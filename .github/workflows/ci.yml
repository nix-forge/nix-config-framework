name: CI
on:
  pull_request:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  flake-lock:
    name: Flake lock health (${{ matrix.lockfile }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lockfile:
          - flake.lock
          - flake/dev/flake.lock
    uses: nix-forge/ci/.github/workflows/flake-lock.yml@7903659c4b16378411a3ea79dd73cec5c82708cc # v2.0.0
    with:
      lockfile: ${{ matrix.lockfile }}
  lint:
    name: Repository hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@7903659c4b16378411a3ea79dd73cec5c82708cc # v2.0.0
        with:
          cache: ${{ vars.NIX_CI_CACHE == 'true' }}
          cache-scope: ci-lint
      - name: Check shared workflow contracts
        uses: nix-forge/ci/actions/validate-workflows@7903659c4b16378411a3ea79dd73cec5c82708cc # v2.0.0
      - name: Run repository hooks and publication checks
        uses: nix-forge/ci/actions/repository-checks@7903659c4b16378411a3ea79dd73cec5c82708cc # v2.0.0
  flake:
    name: Flake checks (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@7903659c4b16378411a3ea79dd73cec5c82708cc # v2.0.0
        with:
          cache: ${{ vars.NIX_CI_CACHE == 'true' }}
          cache-scope: ci-flake
      - name: Materialize partition sources
        run: nix store add-path flake/dev
      - name: Run native flake checks
        env:
          TARGET_SYSTEM: ${{ matrix.system }}
        run: |
          nix flake check --keep-going --show-trace --print-build-logs --no-build --system "${TARGET_SYSTEM}"
          nix build --keep-going --show-trace --print-build-logs --no-link \
            ".#checks.${TARGET_SYSTEM}.discovery"
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/')
    needs: [flake-lock, lint, flake]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch trusted queue validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@7903659c4b16378411a3ea79dd73cec5c82708cc # v2.0.0
