name: CI
on:
  pull_request:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  flake-lock:
    name: Flake lock health (${{ matrix.lockfile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lockfile:
          - flake.lock
          - flake/dev/flake.lock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # v13
        with:
          flake-lock-path: ${{ matrix.lockfile }}
          ignore-missing-flake-lock: false
          fail-mode: true
          send-statistics: false
  lint:
    name: Repository hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3.22.3
      - name: Test merge queue reconciliation
        run: python3 -m unittest discover -s .github/tests
      - name: Materialize partition sources
        run: nix store add-path flake/dev
      - name: Run prek hooks
        run: nix develop --command prek run --all-files
      - name: Scan repository for leaked secrets
        run: nix develop --command gitleaks detect --source . --redact --no-banner
  flake:
    name: Flake checks (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3.22.3
      - name: Materialize partition sources
        run: nix store add-path flake/dev
      - name: Run native flake checks
        env:
          TARGET_SYSTEM: ${{ matrix.system }}
        run: |
          nix flake check --keep-going --show-trace --print-build-logs --no-build --system "${TARGET_SYSTEM}"
          nix build --keep-going --show-trace --print-build-logs --no-link \
            ".#checks.${TARGET_SYSTEM}.discovery"
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/')
    needs: [flake-lock, lint, flake]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Notify the trusted queue reconciler
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run reconcile-merge-queue.yml --ref main -f source_run_id="$GITHUB_RUN_ID"; then
              exit 0
            fi
            echo "::warning::Queue completion notification attempt $attempt failed"
            sleep 5
          done
          exit 1
