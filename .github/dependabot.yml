version: 2
updates:
  - package-ecosystem: "nix"
    directories:
      - "/"
      - "/flake/dev"
    schedule:
      interval: "weekly"
      day: monday
      time: "05:30"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1
    rebase-strategy: auto
    labels:
      - dependencies
      - nix
    commit-message:
      prefix: build(deps)
      include: scope
    groups:
      nix-inputs-minor-and-patch:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    rebase-strategy: auto
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: build(deps)
      include: scope
    groups:
      shared-ci:
        # Update action and workflow references together for each ci release.
        patterns: ["nix-forge/ci", "nix-forge/ci/*"]
        exclude-patterns:
          - "nix-forge/ci/.github/workflows/slsa-*"
          - "nix-forge/ci/actions/repository-checks"
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
