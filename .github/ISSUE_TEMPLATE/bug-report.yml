name: Bug report
description: Report a reproducible problem in the framework contract or a supported consumer.
title: "[bug] "
body:
  - type: input
    id: component
    attributes:
      label: Framework component or option
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Framework, flake, and Nix revisions
    validations:
      required: true
  - type: input
    id: consumer
    attributes:
      label: Consumer and target system
      description: Include NixOS, nix-darwin, or Home Manager and the system architecture.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal consumer reproduction
      description: Include public flake inputs and exact commands. Do not include secrets or private paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and diagnostics
      description: Include the relevant redacted evaluation or build output.
    validations:
      required: true
